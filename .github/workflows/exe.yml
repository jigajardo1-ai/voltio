# Compila Voltio.exe en los servidores de GitHub.
#
# Asi el ejecutable se genera sin instalar nada en el PC de nadie, y siempre a
# partir de lo que hay en el repo. Se dispara a mano o al publicar una etiqueta.

name: Ejecutable de Windows

on:
  workflow_dispatch:          # boton "Run workflow" en la pestaña Actions
  push:
    tags: ['v*']

permissions:
  contents: write             # necesario para adjuntar el .exe a la release

jobs:
  construir:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 y no la ultima: PyInstaller suele tardar en soportar las
          # versiones recien salidas, y aqui solo importa que compile.
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pywebview==6.2.1 pyinstaller==6.11.1

      - name: Generar el HTML empaquetado
        run: python build.py

      - name: Compilar el ejecutable
        run: >
          pyinstaller
          --onefile
          --windowed
          --name Voltio
          --icon iconos/voltio.ico
          --add-data "dist/voltio.html;web"
          --version-file version_exe.txt
          escritorio/voltio_app.py

      - name: Comprobar que quedo algo usable
        shell: pwsh
        run: |
          $exe = "dist/Voltio.exe"
          if (-not (Test-Path $exe)) { throw "No se genero $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Voltio.exe: $mb MB"
          # Un ejecutable de menos de 3 MB es senal de que falto algo dentro.
          if ($mb -lt 3) { throw "El ejecutable pesa muy poco ($mb MB): algo no se empaqueto" }

      - uses: actions/upload-artifact@v4
        with:
          name: Voltio-windows
          path: dist/Voltio.exe
          if-no-files-found: error

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Voltio.exe
          body: |
            Voltio para Windows.

            Descarga `Voltio.exe` y ejecutalo. No necesita instalacion.

            **Windows va a mostrar "Windows protegio su PC".** Es porque el
            ejecutable no esta firmado digitalmente (firmarlo cuesta una cuota
            anual). Pulsa "Mas informacion" y despues "Ejecutar de todas formas".

            Tu progreso se guarda en tu PC, en `%LOCALAPPDATA%\Voltio`.
