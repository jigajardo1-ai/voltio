<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Voltio — Aprende electricidad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>">
</head>
<body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────── */

:root {
  --fondo: #f4f6f9;
  --superficie: #ffffff;
  --superficie-2: #eef1f6;
  --borde: #dde3ec;
  --borde-fuerte: #c3ccda;
  --texto: #16202c;
  --texto-suave: #5c6a7d;

  --marca: #f0a500;
  --marca-osc: #c98700;
  --marca-suave: #fff4dc;

  --ok: #47ba3f;
  --ok-osc: #369130;
  --ok-suave: #e8f7e6;
  --mal: #e04a4f;
  --mal-osc: #b53a3e;
  --mal-suave: #fdeced;

  --azul: #3b82f6;
  --violeta: #8b5cf6;
  --verde: #10b981;
  --rojo: #ef4444;
  --ambar: #f0a500;

  --cable: #55637a;
  --electron: #f0a500;

  --r: 16px;
  --sombra: 0 1px 2px rgba(20, 30, 45, .06), 0 4px 14px rgba(20, 30, 45, .06);
  --fuente: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #10151d;
    --superficie: #182029;
    --superficie-2: #212b37;
    --borde: #2b3644;
    --borde-fuerte: #3c4a5c;
    --texto: #e8eef6;
    --texto-suave: #9aa8bb;
    --marca-suave: #33280f;
    --ok-suave: #16301a;
    --mal-suave: #351a1d;
    --cable: #8fa0b8;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  --fondo: #10151d;
  --superficie: #182029;
  --superficie-2: #212b37;
  --borde: #2b3644;
  --borde-fuerte: #3c4a5c;
  --texto: #e8eef6;
  --texto-suave: #9aa8bb;
  --marca-suave: #33280f;
  --ok-suave: #16301a;
  --mal-suave: #351a1d;
  --cable: #8fa0b8;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
}

/* ── Base ────────────────────────────────────────────────────────────────── */

* { box-sizing: border-box; }

body {
  margin: 0;
  font-variant-numeric: tabular-nums;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--fuente);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { line-height: 1.25; margin: 0 0 .4em; letter-spacing: -.015em; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.3rem; }
p { margin: 0 0 .8em; }
sub, sup { line-height: 0; }

button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }

/* Botones con "peso": el borde inferior grueso hace de sombra fisica. */
.btn {
  border: 0;
  border-radius: 14px;
  padding: 14px 26px;
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: .02em;
  text-transform: uppercase;
  transition: transform .06s, filter .15s;
}
.btn.principal {
  background: var(--marca);
  color: #1d1500;
  box-shadow: 0 4px 0 var(--marca-osc);
  min-width: 180px;
}
.btn.principal:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--marca-osc); }
.btn.principal:disabled { background: var(--superficie-2); color: var(--texto-suave); box-shadow: 0 4px 0 var(--borde); }
.btn.secundario {
  background: var(--superficie);
  border: 2px solid var(--borde-fuerte);
  box-shadow: 0 3px 0 var(--borde);
  padding: 11px 20px;
  text-transform: none;
}
.btn.peligro { background: var(--mal); color: #fff; box-shadow: 0 4px 0 var(--mal-osc); text-transform: none; padding: 11px 20px; }
.btn:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }

.prosa { color: var(--texto); }
.prosa ol, .prosa ul { margin: 0 0 .8em; padding-left: 1.3em; }
.prosa li { margin-bottom: .3em; }

.formula {
  font-family: var(--mono);
  font-size: 1.08rem;
  font-weight: 700;
  text-align: center;
  background: var(--superficie-2);
  border-radius: 10px;
  padding: 12px 10px;
  margin: 12px 0;
}
.dato {
  border-left: 4px solid var(--marca);
  background: var(--marca-suave);
  padding: 10px 14px;
  border-radius: 0 10px 10px 0;
  font-size: .95rem;
}

/* ── Barra superior ──────────────────────────────────────────────────────── */

.barra-sup {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 12px max(16px, env(safe-area-inset-left)) 12px 16px;
  background: color-mix(in srgb, var(--superficie) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--borde);
}
.marca { display: flex; align-items: center; gap: 7px; font-weight: 900; font-size: 1.2rem; letter-spacing: -.02em; }
.marca .rayo { color: var(--marca); filter: drop-shadow(0 0 8px rgba(240, 165, 0, .5)); }
.stats { margin-left: auto; display: flex; gap: 14px; }
.stat { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: .95rem; }
.stat .ic { font-style: normal; }
.stat:nth-child(3) .ic { color: var(--mal); }
.icono-btn {
  background: none; border: 0; font-size: 1.25rem; padding: 6px 9px;
  border-radius: 10px; color: var(--texto-suave);
}
.icono-btn:hover { background: var(--superficie-2); }

/* ── Mapa ────────────────────────────────────────────────────────────────── */

.mapa { max-width: 760px; margin: 0 auto; padding: 24px 18px 80px; }
.saludo { text-align: center; margin-bottom: 30px; }
.saludo p { color: var(--texto-suave); margin: 0; }

.modulo { margin-bottom: 42px; }

.mod-cab {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  border-radius: var(--r);
  color: #fff;
  box-shadow: var(--sombra);
}
.mod-cab.ambar   { background: linear-gradient(135deg, #f0a500, #e08700); }
.mod-cab.azul    { background: linear-gradient(135deg, #4f8ef7, #2f6ad6); }
.mod-cab.violeta { background: linear-gradient(135deg, #9b6cf8, #7746e0); }
.mod-cab.verde   { background: linear-gradient(135deg, #19c58c, #0f9b6c); }
.mod-cab.rojo    { background: linear-gradient(135deg, #f2635f, #d13f3b); }
.mod-cab.cerrado { filter: grayscale(.75) brightness(.9); }
.mod-icono { font-size: 1.9rem; line-height: 1; }
.mod-txt { flex: 1; min-width: 0; }
.mod-txt h2 { margin: 0; font-size: 1.15rem; }
.mod-txt p { margin: 0; font-size: .88rem; opacity: .9; }
.mod-prog { text-align: right; font-size: .8rem; font-weight: 800; min-width: 74px; }
.mod-barra { height: 8px; background: rgba(255, 255, 255, .32); border-radius: 99px; overflow: hidden; margin-bottom: 4px; }
.mod-barra i { display: block; height: 100%; background: #fff; border-radius: 99px; transition: width .5s; }
.chip { background: rgba(255, 255, 255, .25); padding: 4px 11px; border-radius: 99px; font-size: .78rem; font-weight: 800; }

/* Camino serpenteante de lecciones */
.camino { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 26px 0 6px; }
.nodo {
  position: relative;
  transform: translateX(var(--desfase, 0));
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: 0; padding: 10px 6px 14px;
  transition: transform .15s;
}
.nodo:not(:last-child)::after {
  content: ""; position: absolute; left: 50%; top: 100%;
  width: 4px; height: 22px; margin-left: -2px; border-radius: 2px;
  background: var(--borde-fuerte);
}
.nodo-cara {
  width: 66px; height: 66px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1.5rem; color: #fff; font-weight: 900;
  background: var(--borde-fuerte);
  box-shadow: 0 5px 0 var(--borde);
  transition: transform .1s, box-shadow .1s;
}
.nodo.activa .nodo-cara { background: var(--marca); color: #1d1500; box-shadow: 0 5px 0 var(--marca-osc); animation: latido 2.4s ease-in-out infinite; }
.nodo.hecha .nodo-cara  { background: var(--ok); box-shadow: 0 5px 0 var(--ok-osc); }
.nodo.cerrada .nodo-cara { background: var(--superficie-2); color: var(--texto-suave); box-shadow: 0 5px 0 var(--borde); }
.nodo:not(:disabled):hover .nodo-cara { transform: translateY(-2px); }
.nodo:not(:disabled):active .nodo-cara { transform: translateY(4px); box-shadow: 0 1px 0 var(--borde); }
.nodo-nombre { font-size: .84rem; font-weight: 700; color: var(--texto-suave); max-width: 130px; text-align: center; }
.nodo.activa .nodo-nombre, .nodo.hecha .nodo-nombre { color: var(--texto); }
.nodo-estrellas { font-size: .7rem; letter-spacing: 1px; color: var(--borde-fuerte); line-height: 1; }
.nodo-estrellas i { font-style: normal; }
.nodo-estrellas i.on { color: var(--marca); }

@keyframes latido {
  0%, 100% { box-shadow: 0 5px 0 var(--marca-osc), 0 0 0 0 rgba(240, 165, 0, .5); }
  50%      { box-shadow: 0 5px 0 var(--marca-osc), 0 0 0 12px rgba(240, 165, 0, 0); }
}

.temario {
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: 0 0 var(--r) var(--r); border-top: 0;
  padding: 4px 18px 6px; margin-top: -6px;
}
.temario summary { cursor: pointer; padding: 12px 0; font-weight: 700; color: var(--texto-suave); font-size: .92rem; }
.temario ul { margin: 0 0 12px; padding-left: 1.2em; color: var(--texto-suave); font-size: .92rem; }
.temario li { margin-bottom: .28em; }

.pie-mapa { text-align: center; color: var(--texto-suave); font-size: .82rem; padding-top: 20px; }

/* ── Leccion ─────────────────────────────────────────────────────────────── */

.pantalla-leccion { min-height: 100vh; min-height: 100dvh; display: flex; }
.leccion { display: flex; flex-direction: column; flex: 1; min-height: 100dvh; }

.lec-cabecera {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; max-width: 740px; margin: 0 auto; width: 100%;
}
.salir { background: none; border: 0; font-size: 1.35rem; color: var(--texto-suave); padding: 2px 8px; border-radius: 8px; }
.salir:hover { background: var(--superficie-2); }
.barra { flex: 1; height: 15px; background: var(--superficie-2); border-radius: 99px; overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--ok); transition: width .35s cubic-bezier(.2, .9, .3, 1); }
.vidas { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; color: var(--mal); }
.vidas.sin-vidas { opacity: .5; }

.lec-escena { flex: 1; width: 100%; max-width: 740px; margin: 0 auto; padding: 8px 18px 24px; }
.paso { animation: entra .3s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.paso-emoji { font-size: 2.6rem; text-align: center; line-height: 1; margin-bottom: 8px; }
.paso-emoji.celebra { animation: brinca .7s ease-out; font-size: 3.6rem; }
@keyframes brinca { 0% { transform: scale(.3) rotate(-14deg); opacity: 0; } 60% { transform: scale(1.18); } 100% { transform: none; opacity: 1; } }

.paso-info h2, .paso-fin h2 { text-align: center; }
.enunciado { font-size: 1.22rem; margin-bottom: 16px; }
.aviso-reintento {
  display: inline-block; background: var(--marca-suave); color: var(--marca-osc);
  font-weight: 800; font-size: .8rem; padding: 4px 12px; border-radius: 99px; margin-bottom: 12px;
}

.visual {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--r);
  padding: 12px;
  margin: 0 0 18px;
  overflow-x: auto;
}
.visual svg { display: block; width: 100%; height: auto; max-width: 520px; margin: 0 auto; }

/* Opciones */
.opciones { display: grid; gap: 11px; }
.opciones.col-2 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opcion {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--superficie);
  border: 2px solid var(--borde);
  box-shadow: 0 3px 0 var(--borde);
  border-radius: 14px; padding: 14px 16px;
  transition: transform .08s, border-color .15s, background .15s;
}
.opcion:hover:not(:disabled) { border-color: var(--borde-fuerte); background: var(--superficie-2); }
.opcion:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--borde); }
.opcion kbd {
  flex: none; width: 26px; height: 26px; display: grid; place-items: center;
  border: 2px solid var(--borde); border-radius: 7px;
  font: 700 .78rem var(--mono); color: var(--texto-suave);
}
.opcion.elegida { border-color: var(--azul); background: color-mix(in srgb, var(--azul) 10%, var(--superficie)); box-shadow: 0 3px 0 color-mix(in srgb, var(--azul) 45%, var(--borde)); }
.opcion.elegida kbd { border-color: var(--azul); color: var(--azul); }
.opcion.correcta { border-color: var(--ok); background: var(--ok-suave); box-shadow: 0 3px 0 var(--ok); }
.opcion.incorrecta { border-color: var(--mal); background: var(--mal-suave); box-shadow: 0 3px 0 var(--mal); }
.opcion:disabled { cursor: default; opacity: 1; }

/* Instruccion de formato: dice como se responde, no que se pregunta. */
.instruccion {
  color: var(--texto-suave); font-size: .88rem; margin: -8px 0 14px;
}

/* Seleccion multiple: casilla visible, porque "marca todas" necesita que se
   note que se puede marcar mas de una. */
.opcion.marcable .casilla {
  flex: none; width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid var(--borde-fuerte); position: relative;
}
.opcion.marcable.elegida .casilla { background: var(--azul); border-color: var(--azul); }
.opcion.marcable.elegida .casilla::after {
  content: "✓"; position: absolute; inset: 0; color: #fff;
  font-size: .8rem; font-weight: 900; display: grid; place-items: center;
}
.opcion.marcable.correcta .casilla { background: var(--ok); border-color: var(--ok); }
.opcion.marcable.incorrecta .casilla { background: var(--mal); border-color: var(--mal); }

/* Ordenar: el numero aparece al tocar, y ese es todo el feedback que hace falta. */
.opcion.ordenable kbd { transition: background .15s, color .15s; }
.opcion.puesta { border-color: var(--azul); background: color-mix(in srgb, var(--azul) 8%, var(--superficie)); }
.opcion.puesta kbd { background: var(--azul); border-color: var(--azul); color: #fff; }
.btn.chico { padding: 8px 16px; font-size: .85rem; }
.opcion.ordenable ~ .btn.chico, .paso .btn.chico { margin-top: 12px; }

/* Emparejar: dos columnas de fichas que se van fijando al acertar. */
.emparejar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.col-emparejar { display: grid; gap: 10px; align-content: start; }
.ficha {
  background: var(--superficie); border: 2px solid var(--borde);
  box-shadow: 0 3px 0 var(--borde); border-radius: 12px;
  padding: 13px 14px; text-align: center; font-weight: 600;
  transition: transform .08s, border-color .15s, opacity .25s;
}
.ficha:hover:not(:disabled) { border-color: var(--borde-fuerte); }
.ficha:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--borde); }
.ficha.elegida { border-color: var(--azul); background: color-mix(in srgb, var(--azul) 10%, var(--superficie)); box-shadow: 0 3px 0 var(--azul); }
.ficha.resuelta { border-color: var(--ok); background: var(--ok-suave); box-shadow: none; opacity: .55; cursor: default; }
.ficha.falla { border-color: var(--mal); background: var(--mal-suave); animation: temblor .4s; }
@keyframes temblor {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* Senalar sobre el diagrama */
.cz-senalable { cursor: pointer; }
.cz-golpe { fill: transparent; }
.cz-senalable:hover .cz-zig { stroke: var(--azul); }
.cz-senalable:hover .cz-golpe { fill: color-mix(in srgb, var(--azul) 12%, transparent); }
.cz-senalable:focus-visible { outline: none; }
.cz-senalable:focus-visible .cz-golpe { fill: color-mix(in srgb, var(--azul) 18%, transparent); stroke: var(--azul); stroke-width: 2; }
.cz-senalable.cz-elegido .cz-zig { stroke: var(--azul); stroke-width: 3.6; }
.cz-senalable.cz-elegido .cz-golpe { fill: color-mix(in srgb, var(--azul) 18%, transparent); }
.cz-senalable.cz-ok .cz-zig { stroke: var(--ok); stroke-width: 3.6; }
.cz-senalable.cz-ok .cz-golpe { fill: color-mix(in srgb, var(--ok) 20%, transparent); }
.cz-senalable.cz-ok .cz-nombre { fill: var(--ok-osc); }
.cz-senalable.cz-mal .cz-zig { stroke: var(--mal); stroke-width: 3.6; }
.cz-senalable.cz-mal .cz-golpe { fill: color-mix(in srgb, var(--mal) 20%, transparent); }
.cz-senalable.cz-mal .cz-nombre { fill: var(--mal-osc); }

/* Entradas numericas */
.campo-unidad { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 6px 0 16px; }
.entrada-grande {
  font: 800 1.5rem var(--mono);
  width: 180px; text-align: center;
  padding: 12px 14px; border-radius: 14px;
  border: 2px solid var(--borde-fuerte); background: var(--superficie); color: var(--texto);
}
.entrada-grande.ok  { border-color: var(--ok); background: var(--ok-suave); }
.entrada-grande.mal { border-color: var(--mal); background: var(--mal-suave); }
.campo-unidad > span { font: 700 1.2rem var(--mono); color: var(--texto-suave); }

.pista { margin-top: 4px; }
.pista summary { cursor: pointer; color: var(--azul); font-weight: 700; font-size: .92rem; }
.pista .prosa { background: var(--superficie-2); border-radius: 10px; padding: 10px 14px; margin-top: 8px; font-size: .94rem; }

/* Pie con feedback */
.lec-pie {
  position: sticky; bottom: 0;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--borde);
  background: var(--superficie);
}
/* Emparejar no usa boton: sin esto el pie deja una franja vacia. */
.lec-pie:empty { display: none; }
.lec-pie > * { max-width: 740px; }
.lec-pie:not(.ok):not(.mal) { justify-content: center; }
.lec-pie.ok  { background: var(--ok-suave); border-top-color: var(--ok); }
.lec-pie.mal { background: var(--mal-suave); border-top-color: var(--mal); }
.lec-pie.ok .btn.principal  { background: var(--ok); color: #fff; box-shadow: 0 4px 0 var(--ok-osc); }
.lec-pie.mal .btn.principal { background: var(--mal); color: #fff; box-shadow: 0 4px 0 var(--mal-osc); }
.lec-pie .btn { margin-left: auto; }

.fb-cuerpo { display: flex; gap: 13px; align-items: flex-start; flex: 1; min-width: 240px; animation: entra .25s; }
.fb-icono {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 900; color: #fff; font-size: 1.1rem;
}
.lec-pie.ok .fb-icono  { background: var(--ok); }
.lec-pie.mal .fb-icono { background: var(--mal); }
.lec-pie.ok strong  { color: var(--ok-osc); font-size: 1.1rem; }
.lec-pie.mal strong { color: var(--mal-osc); font-size: 1.1rem; }
.fb-detalle { font-size: .93rem; margin-top: 3px; }
.fb-detalle p:last-child { margin-bottom: 0; }
.respuesta-buena { font-weight: 600; }
.lista-errores { margin: 0 0 .5em; padding-left: 1.2em; }

/* Fin de leccion */
.paso-fin { text-align: center; padding-top: 26px; }
.estrellas { font-size: 2.2rem; letter-spacing: 8px; color: var(--borde-fuerte); margin: 6px 0 18px; }
.estrellas .on { color: var(--marca); text-shadow: 0 0 18px rgba(240, 165, 0, .55); }
.resumen { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.tarjeta-res {

<script>
(function(){
'use strict';
/* ── js/circuito.js ── */
// circuito.js — motor de dibujo de circuitos en SVG.
//
// Todo se arma con un spec declarativo y sale un <svg> listo para insertar.
// Las resistencias van con el zigzag clasico porque se lee mejor de un vistazo
// que el rectangulo IEC, que es lo que importa en una leccion.

const NS = 'http://www.w3.org/2000/svg';
let contadorId = 0;
const nuevoId = (pre) => `${pre}-${++contadorId}`;

/** Crea un nodo SVG con atributos y, opcionalmente, hijos. */
function el(tag, attrs = {}, hijos = []) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    n.setAttribute(k, String(v));
  }
  for (const h of [].concat(hijos)) if (h) n.appendChild(h);
  return n;
}

const txt = (s) => document.createTextNode(s);

// ── Simbolos ────────────────────────────────────────────────────────────────

/**
 * Zigzag de resistencia sobre un tramo horizontal o vertical.
 * (cx, cy) es el centro del simbolo; largo es la extension total del zigzag.
 */
function zigzag(cx, cy, largo, vertical, amplitud = 11) {
  const n = 6;                       // dientes
  const paso = largo / n;
  const ini = -largo / 2;
  const pts = [[ini, 0]];
  for (let i = 0; i < n; i++) {
    pts.push([ini + paso * (i + 0.5), (i % 2 === 0 ? -1 : 1) * amplitud]);
  }
  pts.push([largo / 2, 0]);
  const d = pts
    .map(([u, v], i) => {
      const [px, py] = vertical ? [cx + v, cy + u] : [cx + u, cy + v];
      return `${i === 0 ? 'M' : 'L'}${px.toFixed(1)} ${py.toFixed(1)}`;
    })
    .join(' ');
  return el('path', { d, class: 'cz-zig' });
}

/** Campo editable incrustado en el diagrama (para los ejercicios de completar). */
function campoHueco(x, y, ancho, hueco) {
  const fo = el('foreignObject', { x, y, width: ancho, height: 32, class: 'cz-fo' });
  const cont = document.createElement('div');
  cont.className = 'cz-hueco';
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = '?';
  input.dataset.hueco = hueco.id;
  input.setAttribute('aria-label', hueco.etiqueta || hueco.id);
  cont.appendChild(input);
  if (hueco.unidad) {
    const u = document.createElement('span');
    u.className = 'cz-unidad';
    u.textContent = hueco.unidad;
    cont.appendChild(u);
  }
  fo.appendChild(cont);
  return fo;
}

/** Resistencia completa: zigzag + etiqueta (valor fijo o hueco por completar). */
function resistor(cfg) {
  const {
    cx, cy, largo = 66, vertical = false,
    nombre = '', valor = '', hueco = null, destacado = false, ladoEtiqueta = 'auto',
    id = null,
  } = cfg;

  const g = el('g', {
    class: 'cz-comp' + (destacado ? ' cz-destacado' : '') + (id ? ' cz-senalable' : ''),
    'data-comp': id,
    tabindex: id ? '0' : null,
    role: id ? 'button' : null,
    'aria-label': id ? `Componente ${nombre || id}` : null,
  });
  if (id) {
    // Area de acierto generosa: el zigzag es un trazo fino y con el dedo no se
    // acierta. El rectangulo transparente se dibuja primero, debajo de todo.
    const m = 26;
    g.appendChild(el('rect', {
      x: cx - (vertical ? m : largo / 2 + 10), y: cy - (vertical ? largo / 2 + 10 : m),
      width: vertical ? m * 2 : largo + 20, height: vertical ? largo + 20 : m * 2,
      class: 'cz-golpe', rx: 8,
    }));
  }
  g.appendChild(zigzag(cx, cy, largo, vertical));

  // El zigzag ocupa +-11 alrededor del eje, asi que las etiquetas tienen que
  // despegarse lo suficiente para no quedar encima de los dientes.
  const lado = ladoEtiqueta === 'auto' ? (vertical ? 'derecha' : 'arriba') : ladoEtiqueta;
  let tx = cx, tyNombre = cy, tyValor = cy, anchor = 'middle';
  // Un campo editable es mas alto que una linea de texto, asi que cuando lo hay
  // el nombre se corre un poco mas para dejarle sitio.
  const conCampo = Boolean(hueco);
  if (lado === 'arriba')    { tyNombre = cy - (conCampo ? 54 : 44); tyValor = cy - 26; }
  if (lado === 'abajo')     { tyNombre = cy + 34; tyValor = cy + 52; }
  if (lado === 'derecha')   { tx = cx + 26; tyNombre = cy - (conCampo ? 14 : 6); tyValor = cy + 12; anchor = 'start'; }
  if (lado === 'izquierda') { tx = cx - 26; tyNombre = cy - (conCampo ? 14 : 6); tyValor = cy + 12; anchor = 'end'; }

  if (nombre) {
    g.appendChild(el('text',
      { x: tx, y: tyNombre, 'text-anchor': anchor, class: 'cz-nombre' }, [txt(nombre)]));
  }

  if (hueco) {
    const ancho = 78;
    const fx = anchor === 'start' ? tx - 4 : anchor === 'end' ? tx - ancho + 4 : tx - ancho / 2;
    // El campo mide 32 de alto: se ancla de modo que su borde inferior no
    // alcance el zigzag.
    const fy = lado === 'abajo' ? tyNombre + 8 : lado === 'arriba' ? cy - 46 : cy - 4;
    g.appendChild(campoHueco(fx, fy, ancho, hueco));
  } else if (valor) {
    g.appendChild(el('text',
      { x: tx, y: nombre ? tyValor : tyNombre, 'text-anchor': anchor, class: 'cz-valor' }, [txt(valor)]));
  }
  return g;
}

/** Fuente DC vertical: barra larga (+) sobre barra corta (−). */
function fuenteDC(cx, cy, etiqueta, hueco = null) {
  const g = el('g', { class: 'cz-comp cz-fuente' });
  g.appendChild(el('line', { x1: cx - 17, y1: cy - 8, x2: cx + 17, y2: cy - 8, class: 'cz-barra-larga' }));
  g.appendChild(el('line', { x1: cx - 8,  y1: cy + 8, x2: cx + 8,  y2: cy + 8, class: 'cz-barra-corta' }));
  g.appendChild(el('text', { x: cx - 23, y: cy - 12, 'text-anchor': 'end', class: 'cz-signo' }, [txt('+')]));
  g.appendChild(el('text', { x: cx - 23, y: cy + 24, 'text-anchor': 'end', class: 'cz-signo' }, [txt('−')]));

  if (hueco) {
    // Al costado no cabe sin chocar con el primer componente del riel: va debajo.
    g.appendChild(campoHueco(cx - 39, cy + 26, 78, hueco));
  } else if (etiqueta) {
    g.appendChild(el('text',
      { x: cx + 24, y: cy + 5, 'text-anchor': 'start', class: 'cz-valor' }, [txt(etiqueta)]));
  }
  return g;
}

/** Cable: polilinea sobre una lista de puntos [[x,y],...]. */
function cable(pts) {
  return el('polyline', { points: pts.map((p) => p.join(',')).join(' '), class: 'cz-cable' });
}

/** Punto de union donde se juntan tres o mas cables. */
function nodo(x, y) { return el('circle', { cx: x, cy: y, r: 4.5, class: 'cz-nodo' }); }

/** Flecha de corriente con etiqueta. `dir` es hacia donde apunta la punta. */
function flechaCorriente(x, y, etiqueta, dir = 'derecha', anclaTexto = 'arriba') {
  const g = el('g', { class: 'cz-flecha' });
  const L = 28;
  const x2 = dir === 'izquierda' ? x - L : x + L;
  g.appendChild(el('line', { x1: x, y1: y, x2, y2: y, 'marker-end': 'url(#cz-punta)' }));
  g.appendChild(el('text', {
    x: (x + x2) / 2,
    y: anclaTexto === 'abajo' ? y + 20 : y - 10,
    'text-anchor': 'middle', class: 'cz-i',
  }, [txt(etiqueta)]));
  return g;
}

/**
 * Puntos animados recorriendo un camino cerrado. Es la forma mas directa de
 * mostrar que algo circula, y de que la velocidad signifique magnitud.
 */
function electrones(pathD, { cantidad = 8, dur = 4, clase = 'cz-e', radio = 4.5 } = {}) {
  const id = nuevoId('cz-camino');
  const g = el('g', { class: 'cz-electrones' });
  g.appendChild(el('path', { id, d: pathD, fill: 'none', stroke: 'none' }));
  for (let i = 0; i < cantidad; i++) {
    const p = el('circle', { r: radio, class: clase });
    const mp = el('mpath', { href: `#${id}` });
    // Safari todavia pide la forma con namespace xlink.
    mp.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', `#${id}`);
    const anim = el('animateMotion', {
      dur: `${dur}s`,
      repeatCount: 'indefinite',
      begin: `${(-dur * i / cantidad).toFixed(2)}s`,
    }, [mp]);
    p.appendChild(anim);
    g.appendChild(p);
  }
  return g;
}

function defsFlecha() {
  return el('defs', {}, [
    el('marker', {
      id: 'cz-punta', viewBox: '0 0 10 10', refX: 8, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse',
    }, [el('path', { d: 'M0 0 L10 5 L0 10 z', class: 'cz-punta' })]),
  ]);
}

// ── Topologias ──────────────────────────────────────────────────────────────

const M = { izq: 84, der: 104, sup: 88, inf: 56 };  // margenes del marco
// El margen derecho es generoso porque en paralelo las etiquetas de la ultima
// rama se dibujan hacia afuera del marco.

/** Serie: fuente al lado izquierdo, resistencias repartidas en el riel superior. */
function armarSerie(spec, svg, W, H) {
  const xL = M.izq, xR = W - M.der, yT = M.sup, yB = H - M.inf;
  const cyF = (yT + yB) / 2;
  const ramas = spec.ramas || [];
  const arriba = ramas.slice(0, 3);
  const derecha = ramas.slice(3, 5);

  const paso = (xR - xL) / (arriba.length + 1);
  const centros = arriba.map((_, i) => xL + paso * (i + 1));
  // Sin esto, con tres resistencias los zigzags se tocan y el riel parece uno solo.
  const largoS = Math.min(66, paso * 0.56);

  svg.appendChild(cable([[xL, cyF - 26], [xL, yT], [xR, yT]]));
  svg.appendChild(cable([[xR, yT], [xR, yB], [xL, yB], [xL, cyF + 26]]));
  svg.appendChild(fuenteDC(xL, cyF, spec.fuente?.etiqueta, spec.fuente?.hueco));

  arriba.forEach((r, i) => {
    svg.appendChild(el('rect',
      { x: centros[i] - largoS / 2 - 3, y: yT - 6, width: largoS + 6, height: 12, class: 'cz-tapa' }));
    svg.appendChild(resistor({
      cx: centros[i], cy: yT, largo: largoS, nombre: r.nombre, valor: r.valor,
      hueco: r.hueco, destacado: r.destacado, id: r.id, ladoEtiqueta: 'arriba',
    }));
  });

  const largoD = Math.min(66, ((yB - yT) / (derecha.length + 1)) * 0.56);
  derecha.forEach((r, i) => {
    const cy = yT + (yB - yT) * ((i + 1) / (derecha.length + 1));
    svg.appendChild(el('rect',
      { x: xR - 6, y: cy - largoD / 2 - 3, width: 12, height: largoD + 6, class: 'cz-tapa' }));
    svg.appendChild(resistor({
      cx: xR, cy, largo: largoD, vertical: true, nombre: r.nombre, valor: r.valor,
      hueco: r.hueco, destacado: r.destacado, id: r.id, ladoEtiqueta: 'izquierda',
    }));
  });

  const loop = `M${xL} ${cyF - 26} L${xL} ${yT} L${xR} ${yT} L${xR} ${yB} L${xL} ${yB} L${xL} ${cyF + 26}`;
  return { loop, xL, xR, yT, yB, cyF, centros, xLibreHasta: (centros[0] ?? xR) - 36 };
}

/** Paralelo: dos rieles horizontales y una rama vertical por resistencia. */
function armarParalelo(spec, svg, W, H) {
  const xL = M.izq, xR = W - M.der, yT = M.sup, yB = H - M.inf;
  const cyF = (yT + yB) / 2;
  const ramas = spec.ramas || [];

  const x0 = xL + 96;
  const xs = ramas.length > 1
    ? ramas.map((_, i) => x0 + ((xR - x0) / (ramas.length - 1)) * i)
    : [(x0 + xR) / 2];
  const xFin = xs[xs.length - 1];

  svg.appendChild(cable([[xL, cyF - 26], [xL, yT], [xFin, yT]]));
  svg.appendChild(cable([[xL, cyF + 26], [xL, yB], [xFin, yB]]));
  svg.appendChild(fuenteDC(xL, cyF, spec.fuente?.etiqueta, spec.fuente?.hueco));

  ramas.forEach((r, i) => {
    const x = xs[i];
    svg.appendChild(cable([[x, yT], [x, yB]]));
    svg.appendChild(el('rect', { x: x - 6, y: cyF - 36, width: 12, height: 72, class: 'cz-tapa' }));
    svg.appendChild(resistor({
      cx: x, cy: cyF, vertical: true, nombre: r.nombre, valor: r.valor,
      hueco: r.hueco, destacado: r.destacado, id: r.id, ladoEtiqueta: 'derecha',
    }));
    if (i > 0 && i < ramas.length - 1) {
      svg.appendChild(nodo(x, yT));
      svg.appendChild(nodo(x, yB));
    }
  });

  const loop = `M${xL} ${cyF - 26} L${xL} ${yT} L${xs[0]} ${yT} L${xs[0]} ${yB} L${xL} ${yB} L${xL} ${cyF + 26}`;
  return { loop, xL, xR, yT, yB, cyF, xs, xLibreHasta: xs[0] };
}

/** Mixto: una resistencia en serie alimentando un paralelo. Base del divisor. */
function armarMixto(spec, svg, W, H) {
  const xL = M.izq, xR = W - M.der, yT = M.sup, yB = H - M.inf;
  const cyF = (yT + yB) / 2;
  const serie = spec.serie || [];
  const par = spec.paralelo || [];

  const xSerie = xL + (xR - xL) * 0.32;
  const xPar0 = xL + (xR - xL) * 0.64;
  const xsP = par.length > 1
    ? par.map((_, i) => xPar0 + ((xR - xPar0) / (par.length - 1)) * i)
    : [(xPar0 + xR) / 2];
  const xFin = xsP[xsP.length - 1];

  svg.appendChild(cable([[xL, cyF - 26], [xL, yT], [xFin, yT]]));
  svg.appendChild(cable([[xL, cyF + 26], [xL, yB], [xFin, yB]]));
  svg.appendChild(fuenteDC(xL, cyF, spec.fuente?.etiqueta, spec.fuente?.hueco));

  if (serie[0]) {
    svg.appendChild(el('rect', { x: xSerie - 36, y: yT - 6, width: 72, height: 12, class: 'cz-tapa' }));
    svg.appendChild(resistor({
      cx: xSerie, cy: yT, nombre: serie[0].nombre, valor: serie[0].valor,
      hueco: serie[0].hueco, destacado: serie[0].destacado, id: serie[0].id, ladoEtiqueta: 'arriba',
    }));
  }

  par.forEach((r, i) => {
    const x = xsP[i];
    svg.appendChild(cable([[x, yT], [x, yB]]));
    svg.appendChild(el('rect', { x: x - 6, y: cyF - 36, width: 12, height: 72, class: 'cz-tapa' }));
    svg.appendChild(resistor({
      cx: x, cy: cyF, vertical: true, nombre: r.nombre, valor: r.valor,
      hueco: r.hueco, destacado: r.destacado, id: r.id, ladoEtiqueta: 'derecha',
    }));
    if (i > 0 && i < par.length - 1) { svg.appendChild(nodo(x, yT)); svg.appendChild(nodo(x, yB)); }
  });

  const loop = `M${xL} ${cyF - 26} L${xL} ${yT} L${xsP[0]} ${yT} L${xsP[0]} ${yB} L${xL} ${yB} L${xL} ${cyF + 26}`;
  return { loop, xL, xR, yT, yB, cyF, xSerie, xsP, xLibreHasta: xSerie - 36 };
}

// ── API publica ─────────────────────────────────────────────────────────────

/**
 * Construye el <svg> de un circuito a partir de un spec declarativo:
 *
 *   {
 *     tipo: 'serie' | 'paralelo' | 'mixto',
 *     fuente: { etiqueta: '12 V', hueco: { id, unidad } },
 *     ramas:  [{ nombre: 'R1', valor: '100 Ω', hueco, destacado }],
 *     serie / paralelo: idem, solo para tipo 'mixto',
 *     corriente: { velocidad: 1, etiqueta: 'I' } | false,
 *     ancho, alto, nota, descripcion
 *   }
 */
function construirCircuito(spec) {
  const W = spec.ancho || 520;
  const H = spec.alto || 300;
  const svg = el('svg', {
    viewBox: `0 0 ${W} ${H}`, class: 'cz', role: 'img',
    'aria-label': spec.descripcion || 'Diagrama de circuito',
  });
  svg.appendChild(defsFlecha());

  const geo = spec.tipo === 'paralelo' ? armarParalelo(spec, svg, W, H)
            : spec.tipo === 'mixto'    ? armarMixto(spec, svg, W, H)
            :                            armarSerie(spec, svg, W, H);

  if (spec.corriente !== false) {
    const vel = spec.corriente?.velocidad ?? 1;
    // Velocidad 0 = circuito abierto: no circula nada, no se dibuja nada.
    if (vel > 0) svg.appendChild(electrones(geo.loop, { dur: 4 / vel }));
    if (spec.corriente?.etiqueta) {
      // Arriba solo si queda tramo libre entre la fuente y el primer componente;
      // si no, se rotula el riel de retorno, que siempre esta despejado.
      const cabeArriba = geo.xLibreHasta - geo.xL > 128;
      svg.appendChild(cabeArriba
        ? flechaCorriente(geo.xL + 20, geo.yT - 30, spec.corriente.etiqueta, 'derecha', 'arriba')
        : flechaCorriente((geo.xL + geo.xR) / 2 + 14, geo.yB, spec.corriente.etiqueta, 'izquierda', 'abajo'));
    }
  }

  if (spec.nota) {
    svg.appendChild(el('text',
      { x: W / 2, y: H - 14, 'text-anchor': 'middle', class: 'cz-nota' }, [txt(spec.nota)]));
  }
  return svg;
}

const svgEl = el;
const svgTxt = txt;


/* ── js/estado.js ── */
// estado.js — progreso del usuario: XP, racha, lecciones completadas, vidas.
// Todo se persiste en localStorage, que puede fallar (modo privado, cookies
// bloqueadas), asi que cada acceso va envuelto.

const CLAVE = 'voltio.progreso.v1';

const INICIAL = {
  xp: 0,
  racha: 0,
  ultimoDia: null,      // 'YYYY-MM-DD' del ultimo dia con actividad
  completadas: {},      // { 'f-ohm': { estrellas: 3, mejorXp: 40 } }
  vidas: 5,
  vidasRecarga: null,   // timestamp de la ultima recarga
};

/**
 * Si el navegador bloquea el almacenamiento (incognito, cookies bloqueadas), el
 * progreso se pierde al cerrar. Antes fallaba en silencio; ahora se comprueba
 * de verdad —escribiendo— para poder avisarlo en pantalla.
 */
function probarAlmacenamiento() {
  try {
    const k = '__voltio_prueba__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch { return false; }
}

const hayAlmacenamiento = probarAlmacenamiento();

/** Se pone en true si una escritura falla despues del arranque (cuota llena). */
let escrituraFallida = false;
const guardadoSano = () => hayAlmacenamiento && !escrituraFallida;

function leerCrudo() {
  try {
    const txt = localStorage.getItem(CLAVE);
    return txt ? JSON.parse(txt) : null;
  } catch { return null; }
}

function escribirCrudo(obj) {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(obj));
    escrituraFallida = false;
  } catch {
    escrituraFallida = true;
  }
}

const estado = Object.assign({}, INICIAL, leerCrudo() || {});

// Los objetos anidados hay que fusionarlos aparte, el assign es superficial.
estado.completadas = Object.assign({}, INICIAL.completadas, estado.completadas || {});

const oyentes = new Set();
function suscribir(fn) { oyentes.add(fn); return () => oyentes.delete(fn); }
function avisar() { escribirCrudo(estado); oyentes.forEach((fn) => fn(estado)); }

function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function diasEntre(isoA, isoB) {
  const a = new Date(isoA + 'T00:00:00');
  const b = new Date(isoB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

/** Marca actividad de hoy y actualiza la racha. Devuelve true si la racha subio. */
function tocarRacha() {
  const hoy = hoyISO();
  if (estado.ultimoDia === hoy) return false;
  const salto = estado.ultimoDia ? diasEntre(estado.ultimoDia, hoy) : Infinity;
  estado.racha = salto === 1 ? estado.racha + 1 : 1;
  estado.ultimoDia = hoy;
  avisar();
  return true;
}

/** La racha mostrada muere sola si el usuario no volvio ni ayer ni hoy. */
function rachaVigente() {
  if (!estado.ultimoDia) return 0;
  const salto = diasEntre(estado.ultimoDia, hoyISO());
  return salto <= 1 ? estado.racha : 0;
}

function sumarXp(n) {
  estado.xp += n;
  avisar();
}

/** Las vidas se recargan de a una cada 20 minutos, hasta 5. */
const MS_POR_VIDA = 20 * 60 * 1000;
function sincronizarVidas() {
  if (estado.vidas >= 5) { estado.vidasRecarga = null; return estado.vidas; }
  const ahora = Date.now();
  if (!estado.vidasRecarga) { estado.vidasRecarga = ahora; avisar(); return estado.vidas; }
  const ganadas = Math.floor((ahora - estado.vidasRecarga) / MS_POR_VIDA);
  if (ganadas > 0) {
    estado.vidas = Math.min(5, estado.vidas + ganadas);
    estado.vidasRecarga = estado.vidas >= 5 ? null : estado.vidasRecarga + ganadas * MS_POR_VIDA;
    avisar();
  }
  return estado.vidas;
}

function perderVida() {
  sincronizarVidas();
  if (estado.vidas > 0) {
    estado.vidas -= 1;
    if (estado.vidas < 5 && !estado.vidasRecarga) estado.vidasRecarga = Date.now();
    avisar();
  }
  return estado.vidas;
}

function rellenarVidas() {
  estado.vidas = 5;
  estado.vidasRecarga = null;
  avisar();
}

function completarLeccion(id, { estrellas, xp }) {
  const previo = estado.completadas[id];
  estado.completadas[id] = {
    estrellas: Math.max(estrellas, previo?.estrellas ?? 0),
    mejorXp: Math.max(xp, previo?.mejorXp ?? 0),
  };
  estado.xp += xp;
  tocarRacha();
  avisar();
  return !previo;   // true si es la primera vez que la completa
}

function estaCompletada(id) { return Boolean(estado.completadas[id]); }
function estrellasDe(id) { return estado.completadas[id]?.estrellas ?? 0; }

function reiniciarTodo() {
  Object.assign(estado, INICIAL, { completadas: {} });
  avisar();
}

// ── Respaldo portatil ───────────────────────────────────────────────────────
//
// Sin cuenta ni servidor, la unica forma de que el progreso sobreviva a un
// "limpiar datos de navegacion" —o llegue a otro dispositivo— es que el usuario
// se lo pueda llevar. Se exporta en dos formatos: un archivo .json legible y un
// codigo de texto que cabe en un mensaje.

const FORMATO = 1;

/** Solo lo que vale la pena conservar: las vidas se regeneran solas. */
function instantanea() {
  return {
    formato: FORMATO,
    app: 'voltio',
    creado: new Date().toISOString(),
    datos: {
      xp: estado.xp,
      racha: estado.racha,
      ultimoDia: estado.ultimoDia,
      completadas: estado.completadas,
    },
  };
}

function exportarJSON() {
  return JSON.stringify(instantanea(), null, 2);
}

/** Base64 con paso por UTF-8: el JSON lleva acentos y btoa solo acepta latin1. */
function exportarCodigo() {
  const bytes = new TextEncoder().encode(JSON.stringify(instantanea()));
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return `VOLTIO-${btoa(bin).replace(/=+$/, '')}`;
}

function decodificar(texto) {
  const limpio = String(texto).trim();
  if (!limpio) throw new Error('No pegaste nada.');

  // Acepta indistintamente el archivo .json y el codigo corto.
  if (limpio.startsWith('{')) return JSON.parse(limpio);

  const cuerpo = limpio.replace(/^VOLTIO-/, '').replace(/\s+/g, '');
  const relleno = cuerpo + '='.repeat((4 - (cuerpo.length % 4)) % 4);
  const bin = atob(relleno);
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

/**
 * Restaura un respaldo. `fusionar` conserva lo mejor de cada lado, que es lo
 * sensato al traer progreso de otro dispositivo: nadie quiere perder estrellas
 * por importar un respaldo viejo.
 */
function importar(texto, { fusionar = true } = {}) {
  // Fuera del try: si no, el mensaje util queda tapado por el generico.
  if (!String(texto ?? '').trim()) throw new Error('Pega primero un código de respaldo.');

  let sobre;
  try {
    sobre = decodificar(texto);
  } catch {
    throw new Error('No se pudo leer el respaldo. Revisa que esté completo.');
  }
  if (sobre?.app !== 'voltio' || !sobre?.datos) {
    throw new Error('Eso no parece un respaldo de Voltio.');
  }
  if (sobre.formato > FORMATO) {
    throw new Error('El respaldo viene de una versión más nueva de la app.');
  }

  const d = sobre.datos;
  const completadas = {};
  for (const [id, v] of Object.entries(d.completadas || {})) {
    if (!v || typeof v !== 'object') continue;
    completadas[id] = {
      estrellas: Math.min(3, Math.max(0, Number(v.estrellas) || 0)),
      mejorXp: Math.max(0, Number(v.mejorXp) || 0),
    };
  }

  if (fusionar) {
    for (const [id, v] of Object.entries(estado.completadas)) {
      const previo = completadas[id];
      completadas[id] = {
        estrellas: Math.max(v.estrellas, previo?.estrellas ?? 0),
        mejorXp: Math.max(v.mejorXp, previo?.mejorXp ?? 0),
      };
    }
    estado.xp = Math.max(estado.xp, Number(d.xp) || 0);
    estado.racha = Math.max(estado.racha, Number(d.racha) || 0);
  } else {
    estado.xp = Math.max(0, Number(d.xp) || 0);
    estado.racha = Math.max(0, Number(d.racha) || 0);
  }

  // La fecha mas reciente manda: si no, una racha importada moriria enseguida.
  if (d.ultimoDia && (!estado.ultimoDia || d.ultimoDia > estado.ultimoDia)) {
    estado.ultimoDia = d.ultimoDia;
  }
  estado.completadas = completadas;
  avisar();
  return { lecciones: Object.keys(completadas).length, xp: estado.xp };
}


/* ── js/motor.js ── */
// motor.js — reproduce una leccion paso a paso y devuelve el resultado.
//
// Una leccion es una lista de pasos. Cada paso se declara con un `tipo` y el
// motor sabe pintarlo, corregirlo y dar feedback. Los pasos fallados se vuelven
// a encolar al final: la leccion no termina hasta que todo quedo bien.




// ── Utilidades de respuesta numerica ────────────────────────────────────────

const PREFIJOS = { p: 1e-12, n: 1e-9, u: 1e-6, µ: 1e-6, μ: 1e-6, m: 1e-3, k: 1e3, K: 1e3, M: 1e6, g: 1e9, G: 1e9 };

/**
 * Convierte lo que escribio el usuario a numero. Acepta coma decimal, prefijos
 * de ingenieria ("2k2" y "2k2" incluidos) y unidades pegadas al final.
 */
function aNumero(bruto) {
  if (bruto === null || bruto === undefined) return NaN;
  let s = String(bruto).trim().replace(/\s+/g, '');
  if (!s) return NaN;
  s = s.replace(/(ohm|ohms|Ω|Ω|V|A|W|F|H|s)$/i, '');       // unidad al final, si viene
  s = s.replace(',', '.');

  // Notacion "2k2" / "4M7": el prefijo hace de punto decimal.
  const conPrefijoIntermedio = s.match(/^(-?\d+)([pnuµμmkKMgG])(\d+)$/);
  if (conPrefijoIntermedio) {
    const [, ent, pre, dec] = conPrefijoIntermedio;
    return parseFloat(`${ent}.${dec}`) * PREFIJOS[pre];
  }

  const conSufijo = s.match(/^(-?\d*\.?\d+(?:[eE][-+]?\d+)?)([pnuµμmkKMgG])$/);
  if (conSufijo) return parseFloat(conSufijo[1]) * PREFIJOS[conSufijo[2]];

  const n = parseFloat(s);
  return Number.isFinite(n) ? n : NaN;
}

/** Compara con tolerancia relativa (por defecto 1%), con piso para el cero. */
function coincide(valor, esperado, tolerancia = 0.01) {
  if (!Number.isFinite(valor)) return false;
  const margen = Math.max(Math.abs(esperado) * tolerancia, 1e-9);
  return Math.abs(valor - esperado) <= margen;
}

/** Formatea un numero con prefijo de ingenieria: 4700 -> "4.7 k". */
function formatear(v, unidad = '') {
  if (!Number.isFinite(v)) return '—';
  const abs = Math.abs(v);
  const tabla = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
  const [div, pre] = tabla.find(([d]) => abs >= d) || [1, ''];
  const escalado = v / div;
  const texto = Math.abs(escalado % 1) < 1e-9
    ? escalado.toFixed(0)
    : escalado.toFixed(Math.abs(escalado) < 10 ? 2 : 1).replace(/\.?0+$/, '');
  return `${texto} ${pre}${unidad}`.trim();
}

// ── Construccion del DOM de cada tipo de paso ───────────────────────────────

function h(tag, attrs = {}, hijos = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else n.setAttribute(k, String(v));
  }
  for (const c of [].concat(hijos)) {
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}

/** Zona visual del paso: circuito declarativo, nodo suelto o funcion perezosa. */
function construirVisual(paso) {
  if (paso.circuito) return h('div', { class: 'visual' }, [construirCircuito(paso.circuito)]);
  if (typeof paso.visual === 'function') {
    const v = paso.visual();
    return v ? h('div', { class: 'visual' }, [v]) : null;
  }
  if (paso.visual) return h('div', { class: 'visual' }, [paso.visual]);
  return null;
}

function mezclar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Motor ───────────────────────────────────────────────────────────────────

/**
 * Reproduce una leccion dentro de `contenedor`.
 * Devuelve una promesa con { completada, aciertos, fallos, xp, estrellas }.
 */
function reproducirLeccion(leccion, contenedor, { alSalir } = {}) {
  return new Promise((resolver) => {
    const cola = leccion.pasos.map((p, i) => ({ ...p, _id: i }));
    const total = cola.length;
    let indice = 0;
    let aciertos = 0;
    let fallos = 0;
    let resueltos = 0;          // pasos distintos ya superados (para la barra)
    const yaFallado = new Set();

    contenedor.innerHTML = '';
    const barraInterior = h('i');
    const marcadorVidas = h('span', { class: 'vidas' });
    const cabecera = h('header', { class: 'lec-cabecera' }, [
      h('button', { class: 'salir', 'aria-label': 'Salir de la leccion', onClick: pedirSalida }, ['✕']),
      h('div', { class: 'barra', role: 'progressbar', 'aria-label': 'Progreso de la leccion' }, [barraInterior]),
      marcadorVidas,
    ]);
    const escena = h('main', { class: 'lec-escena' });
    const pie = h('footer', { class: 'lec-pie' });
    contenedor.append(cabecera, escena, pie);

    function pintarVidas() {
      const v = sincronizarVidas();
      marcadorVidas.innerHTML = '';
      marcadorVidas.append(h('span', { class: 'corazon' }, ['♥']), h('b', {}, [String(v)]));
      marcadorVidas.classList.toggle('sin-vidas', v === 0);
    }

    function avanzarBarra() {
      barraInterior.style.width = `${Math.round((resueltos / total) * 100)}%`;
    }

    function pedirSalida() {
      if (resueltos === total || confirm('¿Salir de la leccion? Vas a perder el avance de esta sesion.')) {
        alSalir?.();
        resolver({ completada: false, aciertos, fallos, xp: 0, estrellas: 0 });
      }
    }

    // ── Feedback inferior ──
    function mostrarFeedback({ ok, titulo, detalle, alContinuar }) {
      pie.innerHTML = '';
      pie.className = `lec-pie ${ok ? 'ok' : 'mal'}`;
      const cuerpo = h('div', { class: 'fb-cuerpo' }, [
        h('div', { class: 'fb-icono' }, [ok ? '✓' : '✕']),
        h('div', {}, [
          h('strong', {}, [titulo]),
          detalle ? h('div', { class: 'fb-detalle', html: detalle }) : null,
        ]),
      ]);
      const boton = h('button', { class: 'btn principal', onClick: alContinuar }, ['Continuar']);
      pie.append(cuerpo, boton);
      boton.focus();
      pie.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function limpiarPie() { pie.innerHTML = ''; pie.className = 'lec-pie'; }

    /** Contabiliza el resultado y decide si el paso se re-encola. */
    function resolverPaso(paso, ok, feedback) {
      if (ok) {
        aciertos++;
        resueltos++;
        avanzarBarra();
      } else {
        fallos++;
        if (!yaFallado.has(paso._id)) {
          yaFallado.add(paso._id);
          cola.push({ ...paso, _reintento: true });   // vuelve al final de la cola
        }
        perderVida();
        pintarVidas();
      }
      mostrarFeedback({ ...feedback, ok, alContinuar: siguiente });
    }

    // ── Renderizadores por tipo ──

    function pintarInfo(paso) {
      escena.append(
        h('div', { class: 'paso paso-info' }, [
          paso.emoji ? h('div', { class: 'paso-emoji' }, [paso.emoji]) : null,
          h('h2', {}, [paso.titulo || '']),
          construirVisual(paso),
          paso.cuerpo ? h('div', { class: 'prosa', html: paso.cuerpo }) : null,
        ]),
      );
      pie.innerHTML = '';
      pie.className = 'lec-pie';
      const b = h('button', { class: 'btn principal', onClick: () => { resueltos++; avanzarBarra(); siguiente(); } },
        [paso.textoBoton || 'Entendido']);
      pie.append(b);
      b.focus();
    }

    function pintarAlternativas(paso) {
      // Se baraja pero conservando cual era la correcta.
      const opciones = paso.mezclar === false
        ? paso.opciones.map((o, i) => ({ o, i }))
        : mezclar(paso.opciones.map((o, i) => ({ o, i })));
      let elegida = null;

      const lista = h('div', { class: 'opciones' + (paso.columnas ? ` col-${paso.columnas}` : '') });
      opciones.forEach(({ o, i }, pos) => {
        const texto = typeof o === 'string' ? o : o.texto;
        const btn = h('button', {
          class: 'opcion', type: 'button', dataset: { indice: String(i) },
          onClick: () => {
            lista.querySelectorAll('.opcion').forEach((x) => x.classList.remove('elegida'));
            btn.classList.add('elegida');
            elegida = i;
            comprobar.disabled = false;
          },
        }, [
          h('kbd', {}, [String(pos + 1)]),
          h('span', { html: texto }),
        ]);
        lista.appendChild(btn);
      });

      escena.append(h('div', { class: 'paso paso-preg' }, [
        h('h2', { class: 'enunciado', html: paso.pregunta }),
        construirVisual(paso),
        lista,
      ]));

      const comprobar = h('button', {
        class: 'btn principal', disabled: 'true',
        onClick: () => {
          const ok = elegida === paso.correcta;
          lista.querySelectorAll('.opcion').forEach((b) => {
            b.disabled = true;
            const i = Number(b.dataset.indice);
            if (i === paso.correcta) b.classList.add('correcta');
            else if (i === elegida) b.classList.add('incorrecta');
          });
          const buena = paso.opciones[paso.correcta];
          const textoBueno = typeof buena === 'string' ? buena : buena.texto;
          resolverPaso(paso, ok, {
            titulo: ok ? (paso.elogio || '¡Correcto!') : 'No es esa',
            detalle: ok
              ? (paso.explicacion || '')
              : `<p class="respuesta-buena">Respuesta correcta: <b>${textoBueno}</b></p>${paso.explicacion || ''}`,
          });
        },
      }, ['Comprobar']);
      comprobar.disabled = true;
      pie.append(comprobar);

      // Atajos 1..9 para responder con teclado.
      const porTeclado = (ev) => {
        const n = Number(ev.key);
        if (n >= 1 && n <= opciones.length) lista.querySelectorAll('.opcion')[n - 1]?.click();
        if (ev.key === 'Enter' && !comprobar.disabled) comprobar.click();
      };
      escena.dataset.teclado = '1';
      document.addEventListener('keydown', porTeclado);
      escena._limpiar = () => document.removeEventListener('keydown', porTeclado);
    }

    function pintarCompletar(paso) {
      const bloque = h('div', { class: 'paso paso-completar' }, [
        h('h2', { class: 'enunciado', html: paso.enunciado }),
        construirVisual(paso),
        paso.pista ? h('details', { class: 'pista' }, [
          h('summary', {}, ['Ver pista']),
          h('div', { class: 'prosa', html: paso.pista }),
        ]) : null,
      ]);
      escena.append(bloque);

      const inputs = [...bloque.querySelectorAll('input[data-hueco]')];
      const comprobar = h('button', { class: 'btn principal', disabled: 'true' }, ['Comprobar']);

      const revisarLlenado = () => {
        comprobar.disabled = !inputs.every((i) => i.value.trim() !== '');
      };
      inputs.forEach((i) => {
        i.addEventListener('input', revisarLlenado);
        i.addEventListener('keydown', (ev) => {
          if (ev.key !== 'Enter') return;
          ev.preventDefault();
          if (!comprobar.disabled) comprobar.click();
        });
      });
      inputs[0]?.focus();

      comprobar.addEventListener('click', () => {
        let todoOk = true;
        const errores = [];
        for (const input of inputs) {
          const def = paso.huecos.find((x) => x.id === input.dataset.hueco);
          if (!def) continue;
          const v = aNumero(input.value);
          const ok = coincide(v, def.respuesta, def.tolerancia ?? 0.01);
          input.closest('.cz-hueco')?.classList.add(ok ? 'ok' : 'mal');
          input.disabled = true;
          if (!ok) {
            todoOk = false;
            errores.push(`<li><b>${def.etiqueta || def.id}</b> = ${formatear(def.respuesta, def.unidad || '')}</li>`);
          }
        }
        comprobar.disabled = true;
        resolverPaso(paso, todoOk, {
          titulo: todoOk ? (paso.elogio || '¡Circuito resuelto!') : 'Hay valores que no cuadran',
          detalle: todoOk
            ? (paso.explicacion || '')
            : `<ul class="lista-errores">${errores.join('')}</ul>${paso.solucion || paso.explicacion || ''}`,
        });
      });
      pie.append(comprobar);
    }

    function pintarEntrada(paso) {
      const campo = h('input', {
        type: 'text', inputmode: 'decimal', autocomplete: 'off', spellcheck: 'false',
        class: 'entrada-grande', placeholder: paso.placeholder || '?',
        'aria-label': paso.enunciado?.replace(/<[^>]+>/g, '') || 'Respuesta',
      });
      escena.append(h('div', { class: 'paso paso-entrada' }, [
        h('h2', { class: 'enunciado', html: paso.enunciado }),
        construirVisual(paso),
        h('div', { class: 'campo-unidad' }, [campo, paso.unidad ? h('span', {}, [paso.unidad]) : null]),
        paso.pista ? h('details', { class: 'pista' }, [
          h('summary', {}, ['Ver pista']), h('div', { class: 'prosa', html: paso.pista }),
        ]) : null,
      ]));

      const comprobar = h('button', { class: 'btn principal', disabled: 'true' }, ['Comprobar']);
      campo.addEventListener('input', () => { comprobar.disabled = campo.value.trim() === ''; });
      campo.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !comprobar.disabled) { ev.preventDefault(); comprobar.click(); }
      });
      campo.focus();

      comprobar.addEventListener('click', () => {
        const v = aNumero(campo.value);
        const ok = coincide(v, paso.respuesta, paso.tolerancia ?? 0.01);
        campo.disabled = true;
        campo.classList.add(ok ? 'ok' : 'mal');
        comprobar.disabled = true;
        resolverPaso(paso, ok, {
          titulo: ok ? (paso.elogio || '¡Exacto!') : 'No es ese numero',
          detalle: ok
            ? (paso.explicacion || '')
            : `<p class="respuesta-buena">Respuesta: <b>${formatear(paso.respuesta, paso.unidad || '')}</b></p>${paso.solucion || paso.explicacion || ''}`,
        });
      });
      pie.append(comprobar);
    }

    /**
     * Marca todas las correctas. Se corrige como conjunto: acertar tres de
     * cuatro no es acertar, porque justamente se evalua saber donde parar.
     */
    function pintarMultiple(paso) {
      const elegidas = new Set();
      const lista = h('div', { class: 'opciones' });

      const barajadas = paso.mezclar === false
        ? paso.opciones.map((o, i) => ({ o, i }))
        : mezclar(paso.opciones.map((o, i) => ({ o, i })));

      barajadas.forEach(({ o, i }) => {
        const btn = h('button', {
          class: 'opcion marcable', type: 'button', dataset: { indice: String(i) },
          'aria-pressed': 'false',
          onClick: () => {
            const activa = elegidas.has(i);
            if (activa) elegidas.delete(i); else elegidas.add(i);
            btn.classList.toggle('elegida', !activa);
            btn.setAttribute('aria-pressed', String(!activa));
            comprobar.disabled = elegidas.size === 0;
          },
        }, [h('span', { class: 'casilla' }), h('span', { html: typeof o === 'string' ? o : o.texto })]);
        lista.appendChild(btn);
      });

      escena.append(h('div', { class: 'paso paso-preg' }, [
        h('h2', { class: 'enunciado', html: paso.pregunta }),
        h('p', { class: 'instruccion' }, ['Puede haber más de una correcta.']),
        construirVisual(paso),
        lista,
      ]));

      const comprobar = h('button', {
        class: 'btn principal', disabled: 'true',
        onClick: () => {
          const esperadas = new Set(paso.correctas);
          const ok = esperadas.size === elegidas.size && [...esperadas].every((i) => elegidas.has(i));
          lista.querySelectorAll('.opcion').forEach((b) => {
            b.disabled = true;
            const i = Number(b.dataset.indice);
            if (esperadas.has(i)) b.classList.add('correcta');
            else if (elegidas.has(i)) b.classList.add('incorrecta');
          });
          const nombres = paso.correctas
            .map((i) => (typeof paso.opciones[i] === 'string' ? paso.opciones[i] : paso.opciones[i].texto))
            .map((x) => `<li>${x}</li>`).join('');
          resolverPaso(paso, ok, {
            titulo: ok ? (paso.elogio || '¡Todas!') : 'No es esa combinación',
            detalle: ok ? (paso.explicacion || '')
              : `<p class="respuesta-buena">Las correctas eran:</p><ul class="lista-errores">${nombres}</ul>${paso.explicacion || ''}`,
          });
        },
      }, ['Comprobar']);
      comprobar.disabled = true;
      pie.append(comprobar);
    }

    /**
     * Unir dos columnas. Se resuelve par a par y el error se avisa al instante,
     * que es lo que hace que emparejar sirva para memorizar.
     */
    function pintarEmparejar(paso) {
      const izq = mezclar(paso.pares.map((p, i) => ({ txt: p.a, i })));
      const der = mezclar(paso.pares.map((p, i) => ({ txt: p.b, i })));
      let selIzq = null;
      let resueltos = 0;
      let huboError = false;

      const colIzq = h('div', { class: 'col-emparejar' });
      const colDer = h('div', { class: 'col-emparejar' });

      const limpiarSel = () => {
        colIzq.querySelectorAll('.ficha').forEach((f) => f.classList.remove('elegida'));
        selIzq = null;
      };

      const intentar = (fichaDer, indiceDer) => {
        if (!selIzq) return;
        const fichaIzq = selIzq.nodo;
        if (selIzq.indice === indiceDer) {
          [fichaIzq, fichaDer].forEach((f) => {
            f.classList.remove('elegida');
            f.classList.add('resuelta');
            f.disabled = true;
          });
          // Las resueltas bajan al pie de su columna: las pendientes quedan
          // arriba y, al terminar, cada par se lee en la misma fila.
          colIzq.appendChild(fichaIzq);
          colDer.appendChild(fichaDer);
          resueltos++;
          limpiarSel();
          if (resueltos === paso.pares.length) {
            resolverPaso(paso, !huboError, {
              titulo: huboError ? 'Listo, pero con tropiezos' : (paso.elogio || '¡Todo emparejado!'),
              detalle: paso.explicacion || '',
            });
          }
        } else {
          huboError = true;
          [fichaIzq, fichaDer].forEach((f) => {
            f.classList.add('falla');
            setTimeout(() => f.classList.remove('falla'), 550);
          });
          limpiarSel();
        }
      };

      izq.forEach(({ txt, i }) => {
        const f = h('button', {
          class: 'ficha', type: 'button',
          onClick: () => {
            if (f.classList.contains('resuelta')) return;
            limpiarSel();
            f.classList.add('elegida');
            selIzq = { nodo: f, indice: i };
          },
        }, [h('span', { html: txt })]);
        colIzq.appendChild(f);
      });

      der.forEach(({ txt, i }) => {
        const f = h('button', {
          class: 'ficha', type: 'button',
          onClick: () => { if (!f.classList.contains('resuelta')) intentar(f, i); },
        }, [h('span', { html: txt })]);
        colDer.appendChild(f);
      });

      escena.append(h('div', { class: 'paso paso-emparejar' }, [
        h('h2', { class: 'enunciado', html: paso.enunciado }),
        h('p', { class: 'instruccion' }, ['Toca uno de cada lado para unirlos.']),
        h('div', { class: 'emparejar' }, [colIzq, colDer]),
      ]));
      // No hay boton: el paso se cierra solo al emparejarlo todo.
    }

    /**
     * Ordenar una secuencia tocando en orden. Se usa click numerado en vez de
     * arrastrar porque con el dedo el arrastre falla y aca lo evaluado es el
     * orden, no la destreza.
     */
    function pintarOrdenar(paso) {
      const barajados = mezclar(paso.pasos.map((txt, i) => ({ txt, i })));
      const elegidos = [];

      const lista = h('div', { class: 'opciones' });
      barajados.forEach(({ txt, i }) => {
        const btn = h('button', {
          class: 'opcion ordenable', type: 'button', dataset: { indice: String(i) },
          onClick: () => {
            if (btn.classList.contains('puesta')) return;
            elegidos.push(i);
            btn.classList.add('puesta');
            btn.querySelector('kbd').textContent = String(elegidos.length);
            comprobar.disabled = elegidos.length !== paso.pasos.length;
          },
        }, [h('kbd', {}, ['·']), h('span', { html: txt })]);
        lista.appendChild(btn);
      });

      const deshacer = h('button', {
        class: 'btn secundario chico',
        onClick: () => {
          const ultimo = elegidos.pop();
          if (ultimo === undefined) return;
          const btn = lista.querySelector(`[data-indice="${ultimo}"]`);
          btn.classList.remove('puesta');
          btn.querySelector('kbd').textContent = '·';
          comprobar.disabled = true;
        },
      }, ['Deshacer']);

      escena.append(h('div', { class: 'paso paso-preg' }, [
        h('h2', { class: 'enunciado', html: paso.enunciado }),
        h('p', { class: 'instruccion' }, ['Tócalos en el orden correcto.']),
        construirVisual(paso),
        lista,
        deshacer,
      ]));

      const comprobar = h('button', {
        class: 'btn principal', disabled: 'true',
        onClick: () => {
          const ok = elegidos.every((v, k) => v === k);
          lista.querySelectorAll('.opcion').forEach((b) => {
            b.disabled = true;
            const i = Number(b.dataset.indice);
            b.classList.add(elegidos[i] === i ? 'correcta' : 'incorrecta');
          });
          deshacer.disabled = true;
          const bueno = paso.pasos.map((x, k) => `<li>${k + 1}. ${x}</li>`).join('');
          resolverPaso(paso, ok, {
            titulo: ok ? (paso.elogio || '¡Orden correcto!') : 'Ese no es el orden',
            detalle: ok ? (paso.explicacion || '')
              : `<p class="respuesta-buena">El orden era:</p><ul class="lista-errores">${bueno}</ul>${paso.explicacion || ''}`,
          });
        },
      }, ['Comprobar']);
      comprobar.disabled = true;
      pie.append(comprobar);
    }

    /**
     * Señalar un componente sobre el propio diagrama. Es el formato que mas se
     * parece a leer un esquema de verdad: no hay alternativas que descarten por
     * eliminacion, hay que mirar el circuito.
     */
    function pintarSenalar(paso) {
      const bloque = h('div', { class: 'paso paso-senalar' }, [
        h('h2', { class: 'enunciado', html: paso.enunciado }),
        h('p', { class: 'instruccion' }, ['Toca el componente en el diagrama.']),
        construirVisual(paso),
      ]);
      escena.append(bloque);

      let elegido = null;
      const comps = [...bloque.querySelectorAll('[data-comp]')];
      const marcar = (g) => {
        comps.forEach((c) => c.classList.remove('cz-elegido'));
        g.classList.add('cz-elegido');
        elegido = g.dataset.comp;
        comprobar.disabled = false;
      };
      comps.forEach((g) => {
        g.addEventListener('click', () => marcar(g));
        g.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); marcar(g); }
        });
      });

      const comprobar = h('button', {
        class: 'btn principal', disabled: 'true',
        onClick: () => {
          const ok = elegido === paso.correcta;
          comps.forEach((g) => {
            g.classList.remove('cz-elegido');
            g.style.pointerEvents = 'none';
            if (g.dataset.comp === paso.correcta) g.classList.add('cz-ok');
            else if (g.dataset.comp === elegido) g.classList.add('cz-mal');
          });
          comprobar.disabled = true;
          resolverPaso(paso, ok, {
            titulo: ok ? (paso.elogio || '¡Ese es!') : 'No es ese',
            detalle: ok ? (paso.explicacion || '')
              : `<p class="respuesta-buena">Era <b>${paso.nombreCorrecto || paso.correcta}</b>.</p>${paso.explicacion || ''}`,
          });
        },
      }, ['Comprobar']);
      comprobar.disabled = true;
      pie.append(comprobar);
    }

    // ── Bucle principal ──

    function siguiente() {
      escena._limpiar?.();
      escena._limpiar = null;

      if (indice >= cola.length) return terminar();

      if (sincronizarVidas() === 0) return sinVidas();

      const paso = cola[indice++];
      escena.innerHTML = '';
      limpiarPie();
      pintarVidas();

      if (paso._reintento) {
        escena.append(h('div', { class: 'aviso-reintento' }, ['Volvamos a esta']));
      }

      const pintores = {
        info: pintarInfo,
        alternativas: pintarAlternativas,
        completar: pintarCompletar,
        entrada: pintarEntrada,
        multiple: pintarMultiple,
        emparejar: pintarEmparejar,
        ordenar: pintarOrdenar,
        senalar: pintarSenalar,
      };
      (pintores[paso.tipo] || pintarInfo)(paso);
      escena.scrollTop = 0;
    }

    function sinVidas() {
      escena.innerHTML = '';
      limpiarPie();
      escena.append(h('div', { class: 'paso paso-fin' }, [
        h('div', { class: 'paso-emoji' }, ['💔']),
        h('h2', {}, ['Te quedaste sin vidas']),
        h('p', { class: 'prosa' }, ['Se recarga una vida cada 20 minutos. Puedes repasar teoria mientras tanto.']),
      ]));
      pie.append(h('button', { class: 'btn principal', onClick: () => {
        alSalir?.();
        resolver({ completada: false, aciertos, fallos, xp: 0, estrellas: 0 });
      } }, ['Volver al mapa']));
    }

    function terminar() {
      const estrellas = fallos === 0 ? 3 : fallos <= 2 ? 2 : 1;
      const xp = (leccion.xp || 20) + (fallos === 0 ? 10 : 0);
      const precision = aciertos + fallos > 0 ? Math.round((aciertos / (aciertos + fallos)) * 100) : 100;

      escena.innerHTML = '';
      limpiarPie();
      barraInterior.style.width = '100%';
      escena.append(h('div', { class: 'paso paso-fin' }, [
        h('div', { class: 'paso-emoji celebra' }, [fallos === 0 ? '⚡' : '🎉']),
        h('h2', {}, [fallos === 0 ? '¡Leccion perfecta!' : '¡Leccion completada!']),
        h('div', { class: 'estrellas' }, [1, 2, 3].map((i) =>
          h('span', { class: i <= estrellas ? 'on' : '' }, ['★']))),
        h('div', { class: 'resumen' }, [
          h('div', { class: 'tarjeta-res xp' }, [h('b', {}, [`+${xp}`]), h('span', {}, ['XP'])]),
          h('div', { class: 'tarjeta-res' }, [h('b', {}, [`${precision}%`]), h('span', {}, ['Precision'])]),
        ]),
      ]));
      pie.append(h('button', { class: 'btn principal', onClick: () =>
        resolver({ completada: true, aciertos, fallos, xp, estrellas }) }, ['Seguir']));
    }

    pintarVidas();
    avanzarBarra();
    siguiente();
  });
}




/* ── js/visuales.js ── */
// visuales.js — animaciones y widgets interactivos de las lecciones.
//
// Cada funcion devuelve un nodo listo para insertar. La regla que se sigue aca
// es que el visual tiene que mostrar el mecanismo, no decorar: si el usuario
// mueve algo, la magnitud fisica que cambia se ve cambiar.

const s = svgEl;
const t = svgTxt;


// ── Analogia hidraulica ─────────────────────────────────────────────────────

/**
 * Estanque, canieria y valvula: la analogia clasica agua/electricidad.
 * `resaltar` pinta una de las tres magnitudes ('voltaje' | 'corriente' |
 * 'resistencia') para que la leccion pueda apuntar a una sola a la vez.
 */
function analogiaHidraulica(resaltar = null) {
  const W = 480, H = 260;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'viz viz-agua', role: 'img',
    'aria-label': 'Analogia hidraulica: estanque, canieria y valvula' });
  svg.appendChild(defsFlecha());

  const marca = (q) => (resaltar === q ? ' resalta' : resaltar ? ' atenua' : '');

  // Estanque elevado = diferencia de potencial.
  const gT = s('g', { class: 'viz-g' + marca('voltaje') });
  gT.appendChild(s('rect', { x: 24, y: 40, width: 96, height: 104, rx: 6, class: 'viz-tanque' }));
  const agua = s('rect', { x: 27, y: 62, width: 90, height: 79, rx: 4, class: 'viz-agua-fill' });
  gT.appendChild(agua);
  gT.appendChild(s('line', { x1: 136, y1: 62, x2: 136, y2: 186, class: 'viz-cota' }));
  gT.appendChild(s('line', { x1: 130, y1: 62, x2: 142, y2: 62, class: 'viz-cota' }));
  gT.appendChild(s('line', { x1: 130, y1: 186, x2: 142, y2: 186, class: 'viz-cota' }));
  gT.appendChild(s('text', { x: 148, y: 118, class: 'viz-rot' }, [t('altura = voltaje')]));
  svg.appendChild(gT);

  // Canieria con agua corriendo = corriente.
  const gC = s('g', { class: 'viz-g' + marca('corriente') });
  gC.appendChild(s('path', { d: 'M72 144 L72 186 L420 186', class: 'viz-tubo' }));
  gC.appendChild(electrones('M72 150 L72 186 L420 186',
    { cantidad: 7, dur: 3, clase: 'viz-gota', radio: 5 }));
  gC.appendChild(s('text', { x: 300, y: 214, 'text-anchor': 'middle', class: 'viz-rot' },
    [t('caudal = corriente')]));
  svg.appendChild(gC);

  // Estrechamiento = resistencia.

    [t('estrechamiento = resistencia')]));

  // El nivel del estanque respira: recuerda que la fuente sostiene la presion.
  const anim = s('animate', {

    attributeName: 'y', values: '62;69;62', dur: '4s', repeatCount: 'indefinite',
