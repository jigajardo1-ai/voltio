<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voltio · pruebas del parser</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body { padding: 24px; max-width: 780px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: .9rem; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--borde); }
    th { font: 700 .75rem var(--fuente); text-transform: uppercase; letter-spacing: .05em; color: var(--texto-suave); }
    .pasa { color: var(--ok); font-weight: 800; }
    .falla { color: var(--mal); font-weight: 800; }
    tr.falla-fila { background: var(--mal-suave); }
    #resumen { font: 800 1.2rem var(--fuente); padding: 14px 18px; border-radius: 12px; margin-bottom: 18px; }
    #resumen.ok { background: var(--ok-suave); color: var(--ok-osc); }
    #resumen.mal { background: var(--mal-suave); color: var(--mal-osc); }
  </style>
</head>
<body>
  <h1>Parser de respuestas</h1>
  <p class="prosa">Lo que el usuario escribe no viene normalizado: coma decimal, prefijos de
     ingenieria, unidades pegadas. Si el parser falla, la app marca mal una respuesta correcta,
     que es el peor error posible en una app de aprendizaje.</p>
  <div id="resumen"></div>
  <table><thead><tr><th>Entrada</th><th>Esperado</th><th>Obtenido</th><th></th></tr></thead>
    <tbody id="filas"></tbody></table>

  <script type="module">
    import { aNumero, coincide, formatear } from '../js/motor.js';

    const CASOS = [
      ['8', 8], ['8,0', 8], ['8.0', 8], ['  8  ', 8],
      ['1k', 1000], ['1.5k', 1500], ['1,5k', 1500], ['1K', 1000],
      ['2k2', 2200], ['4M7', 4.7e6],
      ['150', 150], ['150 Ω', 150], ['150 ohm', 150], ['150ohms', 150],
      ['1800', 1800], ['1.8k', 1800],
      ['0.03', 0.03], ['0,03', 0.03], ['30m', 0.03], ['30mA', 0.03],
      ['800', 800], ['12V', 12], ['1e3', 1000], ['2.2u', 2.2e-6],
      ['-5', -5],
      ['hola', NaN], ['', NaN], ['   ', NaN],
    ];

    const filas = document.getElementById('filas');
    let fallos = 0;

    for (const [entrada, esperado] of CASOS) {
      const v = aNumero(entrada);
      const ok = Number.isNaN(esperado) ? Number.isNaN(v) : coincide(v, esperado, 0.001);
      if (!ok) fallos++;
      const tr = document.createElement('tr');
      if (!ok) tr.className = 'falla-fila';
      tr.innerHTML = `<td>${JSON.stringify(entrada)}</td>` +
        `<td>${Number.isNaN(esperado) ? 'NaN' : esperado}</td>` +
        `<td>${Number.isNaN(v) ? 'NaN' : v}</td>` +
        `<td class="${ok ? 'pasa' : 'falla'}">${ok ? '✓' : '✕'}</td>`;
      filas.appendChild(tr);
    }

    const res = document.getElementById('resumen');
    res.className = fallos ? 'mal' : 'ok';
    res.textContent = fallos
      ? `${fallos} de ${CASOS.length} fallan`
      : `Los ${CASOS.length} casos pasan`;

    // Para leerlo desde automatizacion sin parsear el DOM.
    window.resultado = { total: CASOS.length, fallos };
  </script>
</body>
</html>
